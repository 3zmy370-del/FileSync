name: FileSync
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  FileSync:
    type: application
    platform: iOS
    sources:
      - FileSync
    info:
      path: FileSync/Info.plist
      properties:
        CFBundleDisplayName: FileSync
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.filesync
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
